<!-- @dsCard group="Fields" height=916 subtitle="lightning-input date · time · datetime" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>DateInput preview</title><style>body{margin:0;background:var(--ftk-color-background,var(--surface))}.pv{padding:24px 28px 32px;font-family:var(--font-sans);box-sizing:border-box;width:100%;max-width:900px}.pv-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px 24px}.pv-stack{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.pv-wide{grid-column:1/-1}.pv-item{position:relative;min-width:0;padding:12px;margin:0 -12px;border-radius:var(--radius-medium);outline:none;transition:background-color .12s ease}.pv-item:hover,.pv-item:focus-within{background:color-mix(in srgb,var(--surface-muted) 55%,var(--surface))}.pv-item:focus-visible{box-shadow:var(--focus-ring)}.pv-name{position:absolute;right:8px;top:-10px;z-index:40;max-width:min(420px,80%);padding:4px 8px;border-radius:var(--radius-medium);background:var(--tooltip);color:var(--on-brand);font:12px/1.4 var(--font-sans);opacity:0;transform:translateY(2px);transition:opacity .12s ease,transform .12s ease;pointer-events:none}.pv-item:hover>.pv-name,.pv-item:focus-visible>.pv-name{opacity:1;transform:none}@media (max-width:560px){.pv-grid{grid-template-columns:minmax(0,1fr)}}</style></head>
<body>
<div id="root"></div>
<script>
  var F = window.FTK, h = React.createElement;
  F.syncPreviewStyle();
  function Demo(name, child, wide) { return h('div', { className: 'pv-item' + (wide ? ' pv-wide' : ''), tabIndex: 0 }, h('span', { className: 'pv-name', role: 'tooltip' }, name), child); }
  var today = '2026-10-20';
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv pv-grid' },
    Demo('date · open datepicker: selected day in brand, today in bold', h('div', { style: { minHeight: 330 } }, h(F.DateInput, { label: 'Event date', defaultValue: '2026-10-24', today: today, open: true, required: true }))),
    h('div', { style: { display: 'grid', gap: 8, alignContent: 'start' } },
      Demo('date · closed, formatted value', h(F.DateInput, { label: 'Date of birth', defaultValue: '1988-04-12', today: today })),
      Demo('date · min today (minDateType__c today): past days disabled', h(F.DateInput, { label: 'Preferred start date', min: today, today: today })),
      Demo('date · required, error', h(F.DateInput, { label: 'Move-in date', required: true, today: today, error: 'Complete this field.' })),
      Demo('time · lightning-input time, 15-minute list', h(F.DateInput, { type: 'time', label: 'Arrival time', defaultValue: '09:30' }))),
    Demo('datetime · Date and Time sub-inputs side by side', h(F.DateInput, { type: 'datetime', label: 'Appointment', defaultValue: '2026-11-03T14:00', today: today, required: true }), true)
  ));
</script>
</body>
</html>
