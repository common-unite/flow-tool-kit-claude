<!-- @dsCard group="Template" height=1261 subtitle="formSurveyQuestion · formSurveyScope · Survey_Section__c" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SurveyQuestion preview</title><style>body{margin:0;background:var(--ftk-color-background,var(--surface))}.pv{padding:24px 28px 32px;font-family:var(--font-sans);box-sizing:border-box;width:100%;max-width:900px}.pv-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px 24px}.pv-stack{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.pv-wide{grid-column:1/-1}.pv-item{position:relative;min-width:0;padding:12px;margin:0 -12px;border-radius:var(--radius-medium);outline:none;transition:background-color .12s ease}.pv-item:hover,.pv-item:focus-within{background:color-mix(in srgb,var(--surface-muted) 55%,var(--surface))}.pv-item:focus-visible{box-shadow:var(--focus-ring)}.pv-name{position:absolute;right:8px;top:-10px;z-index:40;max-width:min(420px,80%);padding:4px 8px;border-radius:var(--radius-medium);background:var(--tooltip);color:var(--on-brand);font:12px/1.4 var(--font-sans);opacity:0;transform:translateY(2px);transition:opacity .12s ease,transform .12s ease;pointer-events:none}.pv-item:hover>.pv-name,.pv-item:focus-visible>.pv-name{opacity:1;transform:none}@media (max-width:560px){.pv-grid{grid-template-columns:minmax(0,1fr)}}.pv-frame{border:1px solid var(--border-subtle);border-radius:var(--radius-medium);overflow:hidden;position:relative}</style></head>
<body>
<div id="root"></div>
<script>
  var F = window.FTK, h = React.createElement;
  F.syncPreviewStyle();
  function Demo(name, child, wide) { return h('div', { className: 'pv-item' + (wide ? ' pv-wide' : ''), tabIndex: 0 }, h('span', { className: 'pv-name', role: 'tooltip' }, name), child); }

  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv pv-grid' },
    Demo('Survey mode: the active question lifts with the brand border; the others sit under the veil', h(F.SurveyScope, null,
      h(F.SurveyQuestion, { position: 1, total: 3, required: true, answered: true, showNext: false }, h(F.Picklist, { label: 'How did you hear about us?', variant: 'surveybuttons', options: ['Friend', 'Social media', 'Event'], defaultValue: 'Event' })),
      h(F.SurveyQuestion, { active: true, position: 2, total: 3, required: true, scale: 1.02 }, h(F.Picklist, { label: 'How satisfied are you with the garden?', variant: 'surveybuttons', options: ['1', '2', '3', '4', '5'] })),
      h(F.SurveyQuestion, { position: 3, total: 3 }, h(F.TextArea, { label: 'Anything else?' })))),
    Demo('Single question: no count; Answered pill', h(F.SurveyQuestion, { active: true, total: 1, answered: true }, h(F.Checkbox, { label: 'I would recommend this program', variant: 'checkbox', defaultChecked: true })))
  ));
</script>
</body>
</html>
