<!-- @dsCard group="Fields" height=1780 width=900 subtitle="flowFormMultiselectCheckbox · comboBox · lightning-dual-listbox" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>MultiPicklist preview</title><style>body{margin:0;background:var(--ftk-color-background,var(--surface))}.pv{padding:24px 28px 32px;font-family:var(--font-sans);box-sizing:border-box;width:100%;max-width:900px}.pv-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px 24px}.pv-stack{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.pv-wide{grid-column:1/-1}.pv-item{position:relative;min-width:0;padding:12px;margin:0 -12px;border-radius:var(--radius-medium);outline:none;transition:background-color .12s ease}.pv-item:hover,.pv-item:focus-within{background:color-mix(in srgb,var(--surface-muted) 55%,var(--surface))}.pv-item:focus-visible{box-shadow:var(--focus-ring)}.pv-name{position:absolute;right:8px;top:-10px;z-index:40;max-width:min(420px,80%);padding:4px 8px;border-radius:var(--radius-medium);background:var(--tooltip);color:var(--on-brand);font:12px/1.4 var(--font-sans);opacity:0;transform:translateY(2px);transition:opacity .12s ease,transform .12s ease;pointer-events:none}.pv-item:hover>.pv-name,.pv-item:focus-visible>.pv-name{opacity:1;transform:none}@media (max-width:560px){.pv-grid{grid-template-columns:minmax(0,1fr)}}</style></head>
<body>
<div id="root"></div>
<script>
  var F = window.FTK, h = React.createElement;
  F.syncPreviewStyle();
  function Demo(name, child, wide) { return h('div', { className: 'pv-item' + (wide ? ' pv-wide' : ''), tabIndex: 0 }, h('span', { className: 'pv-name', role: 'tooltip' }, name), child); }
  var needs = ['Rent help', 'Utilities', 'Food', 'Childcare', 'Transportation', 'Job training'];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv pv-grid' },
    Demo('multiselectcheckbox · columns none, wraps at content width', h(F.MultiPicklist, { label: 'What support do you need?', options: needs, defaultValue: ['Rent help', 'Food'], required: true })),
    Demo('multiselectcheckbox · 3 columns (columns 1 to 12)', h(F.MultiPicklist, { label: 'Which services have you used in the past year?', columns: 3, options: ['Food pantry', 'Rent help', 'Utility help', 'Job training', 'Childcare', 'Tax preparation', 'Health clinic', 'Legal aid', 'Transportation'], defaultValue: ['Food pantry', 'Tax preparation'] })),
    Demo('multiselectcheckbox · 4 columns', h(F.MultiPicklist, { label: 'Which days can you volunteer?', columns: 4, options: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday', 'Any day'], defaultValue: ['Tuesday', 'Saturday'] })),
    Demo('multiselectcheckbox · 2 columns', h(F.MultiPicklist, { label: 'What support do you need?', options: needs, columns: 2, defaultValue: ['Utilities'] })),
    Demo('selectallmultiselectcheckbox · adds Select All', h(F.MultiPicklist, { label: 'Languages spoken', variant: 'selectallmultiselectcheckbox', options: ['English', 'Spanish', 'Vietnamese', 'Somali'], columns: 2, defaultValue: ['English', 'Spanish'] })),
    Demo('multiselectcheckbox · exclusive "None of the above" selected: the other options clear and disable', h(F.MultiPicklist, { label: 'Which benefits does your household receive?', options: ['SNAP', 'WIC', 'Medicaid', 'Section 8', 'None of the above'], defaultValue: ['None of the above'] })),
    Demo('separatedbuttons · exclusive "Prefer not to say" and "All of the above"', h(F.MultiPicklist, { label: 'How did you hear about us?', variant: 'separatedbuttons', options: ['Friend', 'Social media', 'Event', 'All of the above', 'Prefer not to say'] }), true),
    Demo('multiselectcheckbox · max 2 (limit reached, others disabled)', h(F.MultiPicklist, { label: 'Pick your top two', options: ['Mentoring', 'Tutoring', 'Events', 'Fundraising'], max: 2, defaultValue: ['Mentoring', 'Events'] })),
    Demo('separatedbuttons · multi-select, selected are brand fills', h(F.MultiPicklist, { label: 'Days available', variant: 'separatedbuttons', options: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], defaultValue: ['Tue', 'Thu'] }), true),
    Demo('multiselectbadge · slds-badge pills, selected brand', h(F.MultiPicklist, { label: 'Interests', variant: 'multiselectbadge', options: ['Arts', 'Sports', 'STEM', 'Music', 'Outdoors', 'Cooking'], defaultValue: ['STEM', 'Music'] }), true),
    Demo('combobox · searchable, open: "N Option(s) Selected", brand checks', h('div', { style: { minHeight: 250 } }, h(F.MultiPicklist, { label: 'Counties served', variant: 'combobox', options: ['Jackson', 'Johnson', 'Wyandotte', 'Clay', 'Platte', 'Cass'], defaultValue: ['Jackson', 'Wyandotte'], open: true }))),
    Demo('combobox · closed', h(F.MultiPicklist, { label: 'Counties served', variant: 'combobox', options: ['Jackson', 'Johnson', 'Wyandotte'], defaultValue: ['Johnson'] })),
    Demo('standard · lightning-dual-listbox (disable-reordering): Available and Chosen lists, move buttons at the top of their column', h(F.MultiPicklist, { label: 'Program areas', variant: 'standard', options: ['Housing', 'Food access', 'Education', 'Health', 'Workforce'], defaultValue: ['Education'] }), true)
  ));
</script>
</body>
</html>
