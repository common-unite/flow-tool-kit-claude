<!-- @dsCard group="Fields" height=1120 subtitle="flowFormRichTextInput · lightning-input-rich-text" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>RichTextInput preview</title><style>body{margin:0;background:var(--ftk-color-background,var(--surface))}.pv{padding:24px 28px 32px;font-family:var(--font-sans);box-sizing:border-box;width:100%;max-width:900px}.pv-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px 24px}.pv-stack{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.pv-wide{grid-column:1/-1}.pv-item{position:relative;min-width:0;padding:12px;margin:0 -12px;border-radius:var(--radius-medium);outline:none;transition:background-color .12s ease}.pv-item:hover,.pv-item:focus-within{background:color-mix(in srgb,var(--surface-muted) 55%,var(--surface))}.pv-item:focus-visible{box-shadow:var(--focus-ring)}.pv-name{position:absolute;right:8px;top:-10px;z-index:40;max-width:min(420px,80%);padding:4px 8px;border-radius:var(--radius-medium);background:var(--tooltip);color:var(--on-brand);font:12px/1.4 var(--font-sans);opacity:0;transform:translateY(2px);transition:opacity .12s ease,transform .12s ease;pointer-events:none}.pv-item:hover>.pv-name,.pv-item:focus-visible>.pv-name{opacity:1;transform:none}.pv-item:has(.ftk-iconbutton-tip,.ftk-tooltip)>.pv-name{opacity:0}@media (max-width:560px){.pv-grid{grid-template-columns:minmax(0,1fr)}}</style></head>
<body>
<div id="root"></div>
<script>
  var F = window.FTK, h = React.createElement;
  F.syncPreviewStyle();
  function Demo(name, child, wide) { return h('div', { className: 'pv-item' + (wide ? ' pv-wide' : ''), tabIndex: 0 }, h('span', { className: 'pv-name', role: 'tooltip' }, name), child); }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv pv-stack' },
    Demo('RichTextInput · default formats (RichTextFormats__c blank): font, size, color, bold, italic, underline, lists, indent, align, link, image, clean', h(F.RichTextInput, { label: 'Program description', required: true, placeholder: 'Tell us about your program', defaultValue: '' })),
    Demo('RichTextInput · formats bold, italic, underline, list, link; with a value', h(F.RichTextInput, { label: 'Additional notes', formats: ['bold', 'italic', 'underline', 'list', 'link'], defaultValue: '<p>We serve <b>48 households</b> each week across Riverside's east side.</p>' })),
    Demo('RichTextInput · essay, minHeight 240px (textAreaMinHeight__c)', h(F.RichTextInput, { label: 'Statement of need', required: true, minHeight: '240px', formats: ['bold', 'italic', 'underline', 'list', 'link'], placeholder: 'Describe the need your program meets' })),
    Demo('RichTextInput · enableRichPlainTextToggle__c: view switcher, toolbar at the bottom', h(F.RichTextInput, { label: 'Message to reviewers', plainTextToggle: true, toolbarPosition: 'bottom', formats: ['bold', 'italic', 'underline', 'list'], defaultValue: '<p>Thanks for your time.</p>' }))
  ));
</script>
</body>
</html>
