<!-- @dsCard group="Foundations" height=790 subtitle="lightning-icon · all 1,764 SLDS 2.30.7 icons" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon browser</title>
<style>
  body { margin: 0; background: var(--ftk-color-background, var(--surface)); }
  .ib { box-sizing: border-box; width: 100%; padding: 20px 24px 24px; font-family: var(--font-sans); color: var(--text); }
  .ib *, .ib *::before, .ib *::after { box-sizing: border-box; }
  .ib-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 12px; }
  .ib-search { flex: 1 1 220px; min-width: 0; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-medium); font: inherit; font-size: 13px; color: var(--text); background: var(--surface); }
  .ib-search::placeholder { color: var(--placeholder); }
  .ib-search:focus { outline: 0; border-color: var(--brand); box-shadow: var(--focus-ring); }
  .ib-cats { display: flex; flex-wrap: wrap; gap: 6px; }
  .ib-cat { height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--surface); color: var(--label); font: inherit; font-size: 12px; cursor: pointer; }
  .ib-cat[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .ib-cat:focus-visible { outline: 0; box-shadow: var(--focus-ring); }
  .ib-meta { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-size: 12px; color: var(--label); }
  .ib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; max-height: 540px; overflow: auto; padding: 2px; }
  .ib-cell { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; min-width: 0; padding: 12px 6px 10px; border: 1px solid transparent; border-radius: var(--radius-medium); background: none; color: var(--brand); font: inherit; cursor: pointer; }
  .ib-cell:hover { background: var(--surface-muted); }
  .ib-cell:focus-visible { outline: 0; border-color: var(--brand); box-shadow: var(--focus-ring); }
  .ib-cell.ib-copied { border-color: var(--brand); background: var(--brand-tint); }
  .ib-name { width: 100%; font-size: 11px; line-height: 1.3; color: var(--label); text-align: center; overflow-wrap: anywhere; }
  .ib-more { display: block; margin: 12px auto 0; height: 32px; padding: 0 16px; border: 1px solid var(--border); border-radius: var(--radius-medium); background: var(--surface); color: var(--brand); font: inherit; font-size: 13px; cursor: pointer; }
  .ib-empty { padding: 32px 0; text-align: center; font-size: 13px; color: var(--label); }
  .ib-toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 8px 12px; border-radius: var(--radius-medium); background: var(--tooltip); color: var(--on-brand); font-size: 12px; pointer-events: none; }
</style></head>
<body>
<div id="root"></div>
<script>
  var F = window.FTK, h = React.createElement, useState = React.useState, useMemo = React.useMemo;
  F.syncPreviewStyle();
  var ALL = Object.keys(window.SLDSIcons || {});
  var CATS = ['utility', 'standard', 'action', 'custom', 'doctype'];
  var COUNTS = {}; CATS.forEach(function (c) { COUNTS[c] = ALL.filter(function (n) { return n.indexOf(c + ':') === 0; }).length; });
  var PAGE = 240;

  function copy(text) {
    try { if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text); } catch (e) {}
    var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(t); return Promise.resolve();
  }

  function Browser() {
    var q = useState(''), cat = useState('utility'), limit = useState(PAGE), copied = useState('');
    var query = q[0].trim().toLowerCase().replace(/\s+/g, '_');
    var list = useMemo(function () {
      return ALL.filter(function (n) {
        if (cat[0] !== 'all' && n.indexOf(cat[0] + ':') !== 0) return false;
        return !query || n.indexOf(query) >= 0;
      });
    }, [query, cat[0]]);
    var shown = list.slice(0, limit[0]);
    function pick(name) { copy(name).then(function () { copied[1](name); setTimeout(function () { copied[1](function (c) { return c === name ? '' : c; }); }, 1400); }); }
    function setCat(c) { cat[1](c); limit[1](PAGE); }
    return h('div', { className: 'ib' },
      h('div', { className: 'ib-bar' },
        h('input', { className: 'ib-search', type: 'search', placeholder: 'Search 1,764 icons, e.g. location, user, calendar', 'aria-label': 'Search icons', value: q[0], onChange: function (e) { q[1](e.target.value); limit[1](PAGE); } }),
        h('div', { className: 'ib-cats', role: 'group', 'aria-label': 'Icon category' },
          ['all'].concat(CATS).map(function (c) {
            return h('button', { key: c, type: 'button', className: 'ib-cat', 'aria-pressed': cat[0] === c ? 'true' : 'false', onClick: function () { setCat(c); } },
              c === 'all' ? 'All ' + ALL.length : c + ' ' + COUNTS[c]);
          }))),
      h('div', { className: 'ib-meta' },
        h('span', null, list.length + (list.length === 1 ? ' icon' : ' icons') + (query ? ' matching "' + q[0].trim() + '"' : '')),
        h('span', null, 'Click an icon to copy its name')),
      list.length === 0
        ? h('div', { className: 'ib-empty' }, 'No icons match. Try a shorter word.')
        : h('div', { className: 'ib-grid' }, shown.map(function (name) {
            return h('button', { key: name, type: 'button', className: 'ib-cell' + (copied[0] === name ? ' ib-copied' : ''), title: 'Copy ' + name, onClick: function () { pick(name); } },
              h(F.Icon, { name: name, size: 'medium' }),
              h('span', { className: 'ib-name' }, name));
          })),
      list.length > shown.length ? h('button', { type: 'button', className: 'ib-more', onClick: function () { limit[1](limit[0] + PAGE); } }, 'Show ' + Math.min(PAGE, list.length - shown.length) + ' more of ' + (list.length - shown.length)) : null,
      copied[0] ? h('div', { className: 'ib-toast', role: 'status' }, 'Copied ' + copied[0]) : null);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Browser));
</script>
</body>
</html>
