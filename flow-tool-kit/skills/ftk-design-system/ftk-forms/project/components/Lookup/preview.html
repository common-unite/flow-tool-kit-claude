<!-- @dsCard group="Fields" height=838 subtitle="flowFormField reference · lightning-input-field lookup" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Lookup preview</title><style>body{margin:0;background:var(--ftk-color-background,var(--surface))}.pv{padding:24px 28px 32px;font-family:var(--font-sans);box-sizing:border-box;width:100%;max-width:900px}.pv-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px 24px}.pv-stack{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.pv-wide{grid-column:1/-1}.pv-item{position:relative;min-width:0;padding:12px;margin:0 -12px;border-radius:var(--radius-medium);outline:none;transition:background-color .12s ease}.pv-item:hover,.pv-item:focus-within{background:color-mix(in srgb,var(--surface-muted) 55%,var(--surface))}.pv-item:focus-visible{box-shadow:var(--focus-ring)}.pv-name{position:absolute;right:8px;top:-10px;z-index:40;max-width:min(420px,80%);padding:4px 8px;border-radius:var(--radius-medium);background:var(--tooltip);color:var(--on-brand);font:12px/1.4 var(--font-sans);opacity:0;transform:translateY(2px);transition:opacity .12s ease,transform .12s ease;pointer-events:none}.pv-item:hover>.pv-name,.pv-item:focus-visible>.pv-name{opacity:1;transform:none}.pv-item:has(.ftk-iconbutton-tip,.ftk-tooltip)>.pv-name{opacity:0}@media (max-width:560px){.pv-grid{grid-template-columns:minmax(0,1fr)}}</style></head>
<body>
<div id="root"></div>
<script>
  var F = window.FTK, h = React.createElement;
  F.syncPreviewStyle();
  function Demo(name, child, wide) { return h('div', { className: 'pv-item' + (wide ? ' pv-wide' : ''), tabIndex: 0 }, h('span', { className: 'pv-name', role: 'tooltip' }, name), child); }
  var accounts = [
    { label: 'Maple Street Farm', value: 'a1', sublabel: 'Riverside' },
    { label: 'Northeast Neighborhood Trust', value: 'a2', sublabel: 'Riverside' },
    { label: 'Maple Street Food Pantry', value: 'a3', sublabel: 'Maple Hill' },
    { label: 'Westside Tenant Partners', value: 'a4', sublabel: 'Riverside' }
  ];
  var contacts = [{ label: 'Maria Lopez', value: 'c1', sublabel: 'Program Director' }];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv pv-grid' },
    Demo('standard · open, typing "north": matches in bold, secondary line, New action (allowNew)', h('div', { style: { minHeight: 236 } }, h(F.Lookup, { label: 'Organization', objectLabel: 'Account', objectIcon: 'standard:account', options: accounts, searchValue: 'north', open: true, allowNew: true, required: true }))),
    h('div', { style: { display: 'grid', gap: 8, alignContent: 'start' } },
      Demo('standard · empty: "Search Accounts..." with the search icon', h(F.Lookup, { label: 'Organization', objectLabel: 'Account', options: accounts })),
      Demo('standard · selected: entity icon, record name, remove button', h(F.Lookup, { label: 'Primary contact', objectLabel: 'Contact', objectIcon: 'standard:contact', options: contacts, defaultValue: 'c1' })),
      Demo('standard · required, error', h(F.Lookup, { label: 'Household', objectLabel: 'Household', objectIcon: 'standard:household', options: [], required: true, error: 'Complete this field.' }))),
    Demo('customSearch · enableCustomLookup__c: brand search button opens the lookup table modal', h(F.Lookup, { label: 'Organization', variant: 'customSearch', objectLabel: 'Account', options: accounts, defaultValue: 'a1' })),
    Demo('recordpicker · referenceFieldOverrideType__c Record Picker, open with no matches', h('div', { style: { minHeight: 92 } }, h(F.Lookup, { label: 'Organization', variant: 'recordpicker', objectLabel: 'Account', options: accounts, searchValue: 'zzz', open: true })))
  ));
</script>
</body>
</html>
