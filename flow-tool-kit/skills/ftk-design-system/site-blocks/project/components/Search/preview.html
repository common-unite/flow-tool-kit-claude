<!doctype html>
<html>
<head><meta charset="utf-8"><style>body{margin:0;background:#ffffff}</style></head>
<body>
<div id="root"></div>
<script>
  var h = React.createElement, SB = window.SB;
  SB.previewAt(1280);
  /* The site search placed in a column, half width */
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(SB.Page, null, h(SB.Section, { sectionHeight: 32 },
      h(SB.Column, { columnWidth: '6' }, h(SB.Search, { placeholder: 'Search programs and shifts...' })),
      h(SB.Column, { columnWidth: '6' }, h(SB.RichContent, { richTextValue: '<p>Search finds programs, shifts and articles the visitor can see.</p>' })))));
</script>
</body>
</html>
