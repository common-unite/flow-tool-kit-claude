<!-- @dsCard group="Page layout" height=120 subtitle="forceCommunity:section" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Section preview</title><style>body{margin:0;background:#ffffff}</style></head>
<body>
<div id="root"></div>
<script>
  var h = React.createElement, SB = window.SB;
  /* Every column split a Section offers, over the faint 12-column grid, each column labelled with its width */
  var splits = [['12'], ['8', '4'], ['6', '6'], ['4', '4', '4'], ['3', '3', '3', '3'], ['3', '9']];
  SB.previewAt(1280);
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(SB.Page, null, splits.map(function (widths, s) {
      return h(SB.Section, { key: s, showGrid: true, sectionHeight: 32 }, widths.map(function (width, c) {
        return h(SB.Column, { key: c, columnWidth: width }, h('div', { className: 'slds-box slds-box_small slds-theme_shade slds-text-align_center' }, width + ' of 12'));
      }));
    })));
</script>
</body>
</html>
